name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - gateway
          - identity
          - tenant
          - order
          - payment
          - inventory
          - customer
          - notification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations image
        if: matrix.service != 'gateway'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          target: migrations
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:migrations-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.3.0'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Update image tags in overlay
        run: |
          OVERLAY="deploy/k8s/overlays/${{ github.event.inputs.environment || 'staging' }}"
          cd "$OVERLAY"
          for service in gateway identity tenant order payment inventory customer notification; do
            kustomize edit set image "saas-platform/${service}=${{ env.IMAGE_PREFIX }}/${service}:${{ github.sha }}"
          done
          cd -
          kustomize build "$OVERLAY" > manifest.yaml

      - name: Run migrations
        run: |
          export KUBECONFIG=kubeconfig
          NAMESPACE="saas-platform-${{ github.event.inputs.environment || 'staging' }}"
          for service in identity tenant order payment inventory customer notification; do
            kubectl delete job ${service}-migration -n $NAMESPACE --ignore-not-found
            cat deploy/k8s/base/${service}/migration-job.yaml | \
              sed "s|image: saas-platform/${service}:migrations-latest|image: ${{ env.IMAGE_PREFIX }}/${service}:migrations-${{ github.sha }}|" | \
              kubectl apply -n $NAMESPACE -f -
            kubectl wait --for=condition=complete job/${service}-migration -n $NAMESPACE --timeout=300s
          done

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          export KUBECONFIG=kubeconfig
          NAMESPACE="saas-platform-${{ github.event.inputs.environment || 'staging' }}"
          kubectl apply -k deploy/k8s/overlays/${{ github.event.inputs.environment || 'staging' }} --namespace $NAMESPACE

      - name: Verify rollout
        run: |
          export KUBECONFIG=kubeconfig
          NAMESPACE="saas-platform-${{ github.event.inputs.environment || 'staging' }}"
          for deploy in gateway identity tenant order payment inventory customer notification; do
            kubectl rollout status deployment/$deploy -n $NAMESPACE --timeout=300s
          done

      - name: Output URL
        id: url
        run: |
          if [ "${{ github.event.inputs.environment || 'staging' }}" = "production" ]; then
            echo "url=https://api.example.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://api.${{ github.event.inputs.environment || 'staging' }}.example.com" >> $GITHUB_OUTPUT
          fi
