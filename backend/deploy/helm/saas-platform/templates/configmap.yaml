---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "saas-platform.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "saas-platform.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.global.environment | quote }}
  DOTNET_gcServer: "1"
  DOTNET_gcConcurrent: "1"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__MinimumLevel__Override__Microsoft: "Warning"
  Serilog__MinimumLevel__Override__System: "Warning"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.global.otel.protocol | quote }}
  MassTransit__Transport: {{ .Values.global.messaging.transport | quote }}
  MassTransit__Host: {{ .Values.global.messaging.host | quote }}
  MassTransit__Port: {{ .Values.global.messaging.port | quote }}
  Redis__Host: {{ .Values.global.redis.host | quote }}
  Redis__Port: {{ .Values.global.redis.port | quote }}
