    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    hpa:
      minReplicas: 3
      maxReplicas: 20
  order:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    hpa:
      minReplicas: 3
      maxReplicas: 20
  payment:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
