replicaCount: 3

image:
  pullPolicy: IfNotPresent

services:
  gateway:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    hpa:
      minReplicas: 3
      maxReplicas: 20
  identity:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
