apiVersion: batch/v1
kind: Job
metadata:
  name: customer-migration
  namespace: saas-platform
  labels:
    app: customer
    component: migration
spec:
  template:
    metadata:
      labels:
        app: customer
        component: migration
    spec:
      serviceAccountName: customer
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: saas-platform/customer:migrations-latest
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "ef", "database", "update", "--no-build"]
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: customer-secrets
                  key: db-connection-string
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  backoffLimit: 3
