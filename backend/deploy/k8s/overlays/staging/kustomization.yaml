apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas-platform-staging

resources:
  - ../../base/shared
  - ../../base/gateway
  - ../../base/identity
  - ../../base/tenant
  - ../../base/order
  - ../../base/payment
  - ../../base/inventory
  - ../../base/customer
  - ../../base/notification

images:
  - name: saas-platform/gateway
    newName: ghcr.io/saas-platform/gateway
    newTag: staging
  - name: saas-platform/identity
    newName: ghcr.io/saas-platform/identity
    newTag: staging
  - name: saas-platform/tenant
    newName: ghcr.io/saas-platform/tenant
    newTag: staging
  - name: saas-platform/order
    newName: ghcr.io/saas-platform/order
    newTag: staging
  - name: saas-platform/payment
    newName: ghcr.io/saas-platform/payment
    newTag: staging
  - name: saas-platform/inventory
    newName: ghcr.io/saas-platform/inventory
    newTag: staging
  - name: saas-platform/customer
    newName: ghcr.io/saas-platform/customer
    newTag: staging
  - name: saas-platform/notification
    newName: ghcr.io/saas-platform/notification
    newTag: staging

configMapGenerator:
  - name: saas-platform-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Staging
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__Microsoft=Warning

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: identity
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: tenant
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: order
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: payment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: inventory
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: customer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Deployment
      name: notification
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 200m
          memory: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 1000m
          memory: 512Mi
  - target:
      kind: Ingress
      name: gateway-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-gateway-tls
